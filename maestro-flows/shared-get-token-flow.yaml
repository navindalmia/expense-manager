---
# SHARED FLOW: Get Verification Token from Database
# Fetches real token from backend internal API
appId: com.navindalmia.expensemanager
name: GetVerificationToken

params:
  - email
---
# Call backend API to get active token for user
- evalScript: |
    const response = http.post('http://localhost:4000/api/internal/get-token', {
        body: JSON.stringify({ email: '${email}' }),
        headers: { 'Content-Type': 'application/json' }
    });
    const tokenResponse = json(response.body);
    output.verificationToken = tokenResponse.token;

# Verify token exists (should not be null/empty)
- assertTrue:
    condition: ${output.verificationToken}
    label: "Verification token should exist for user ${email}"
