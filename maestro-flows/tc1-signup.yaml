appId: com.navindalmia.expensemanager
name: TC1 - Signup Creates Unverified User
---
- launchApp

# Generate unique test email with timestamp
- evalScript: ${output.testEmail = 'e2e-test-' + Date.now() + '@example.com'}

# Run signup flow with dynamic email
- runFlow:
    file: shared-signup-flow.yaml
    env:
      email: ${output.testEmail}
      password: "TestPass123!"
      name: "Test User"

# Verify: CheckEmailScreen shows the email
- assertVisible:
    text: ${output.testEmail}

# Verify: Resend button visible
- assertVisible:
    text: "Resend"

# DATABASE VERIFICATION: User should be unverified
- runFlow:
    file: shared-verify-email-state.yaml
    env:
      email: ${output.testEmail}
      expectedEmailVerified: false
      expectedTokenIsUsed: false
