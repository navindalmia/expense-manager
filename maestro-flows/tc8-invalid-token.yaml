---
# TC8: Invalid/expired token shows error
appId: com.navindalmia.expensemanager
name: TC8 - Invalid Token Error Handling
---
- launchApp

# Generate unique test email
- evalScript: ${output.testEmail = 'e2e-invalid-' + Date.now() + '@example.com'}

# Create user first
- runFlow:
    file: shared-signup-flow.yaml
    env:
      email: ${output.testEmail}
      password: "TestPass123!"
      name: "Test User"

# Try to verify with INVALID token
- openLink:
    link: "expensemanager://verify-email/vrf_definitely_not_a_real_token_xyz"

- waitForAnimationToEnd

# Verify: Error message shown
- extendedWaitUntil:
    visible:
      text: "Invalid or expired"
    timeout: 5000
- assertVisible:
    text: "Invalid or expired"

# Verify: Can go back or retry
- assertVisible:
    text: "Back"
    id: back-button

# DATABASE: User should STILL be unverified
- runFlow:
    file: shared-verify-email-state.yaml
    env:
      email: ${output.testEmail}
      expectedEmailVerified: false
      expectedTokenIsUsed: false
