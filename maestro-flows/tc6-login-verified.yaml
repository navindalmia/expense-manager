---
# TC6: After email verification, user can login
appId: com.navindalmia.expensemanager
name: TC6 - Login Succeeds After Verification
---
- launchApp

# Generate unique test email
- evalScript: ${output.testEmail = 'e2e-verified-' + Date.now() + '@example.com'}
- evalScript: ${output.testPassword = 'TestPass123!'}

# Create user
- runFlow:
    file: shared-signup-flow.yaml
    env:
      email: ${output.testEmail}
      password: ${output.testPassword}
      name: "Test User"

# Get verification token
- runFlow:
    file: shared-get-token-flow.yaml
    env:
      email: ${output.testEmail}

# Verify email via deep link with REAL token
- openLink:
    link: "expensemanager://verify-email/${output.verificationToken}"

- assertVisible:
    text: "Verifying email"


# Success screen should appear
- extendedWaitUntil:
    visible:
      text: "Email verified successfully"
    timeout: 5000
- assertVisible:
    text: "Email verified successfully"

- waitForAnimationToEnd

# DATABASE: Confirm user is verified
- runFlow:
    file: shared-verify-email-state.yaml
    env:
      email: ${output.testEmail}
      expectedEmailVerified: true
      expectedTokenIsUsed: true

# Now login should succeed
- runFlow:
    file: shared-login-flow.yaml
    env:
      email: ${output.testEmail}
      password: ${output.testPassword}

- waitForAnimationToEnd

# Verify: Logged in (should see home screen or dashboard)
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 5000
- assertVisible:
    id: home-screen
