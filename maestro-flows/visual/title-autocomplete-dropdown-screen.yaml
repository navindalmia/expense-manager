appId: com.navindalmia.expensemanager
---
# PR #90: title autocomplete dropdown on Create Expense (fixture history: "Diberr Repro").
# Uses the standing QA fixtures seeded by the e2e-mobile CI job.
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 30000
- tapOn:
    id: "email-input"
- inputText: "test@test.com"
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    id: "password-input"
- inputText: "Test1234!"
- hideKeyboard
- tapOn:
    id: "submit-button"
- assertVisible:
    id: "home-screen"
- tapOn:
    text: "QA Test Group"
- assertVisible:
    id: "expense-list-screen"
- tapOn:
    id: "add-expense-button"
- assertVisible:
    id: "edit-expense-title-input"
- tapOn:
    id: "edit-expense-title-input"
- inputText: "Diberr"
- extendedWaitUntil:
    visible:
      id: "edit-expense-title-suggestions"
    timeout: 10000
- assertScreenshot: "title-autocomplete-dropdown-screen"
