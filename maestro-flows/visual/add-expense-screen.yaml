appId: com.navindalmia.expensemanager
---
# U4 (visual-regression baseline) + U5 (accessibility) for the real "Add
# Expense" screen a user hits every session.
#
# The add-expense screen is EditExpenseScreen in create mode (route
# `EditExpense` with no `expenseId` param; `isCreateMode = !expenseId`), so
# its testIDs are the `edit-expense-*` ones.
#
# Uses the standing pre-verified QA test user (test@test.com) and
# "QA Test Group".
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 30000
- tapOn:
    id: "email-input"
- inputText: "test@test.com"
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    id: "password-input"
- inputText: "Test1234!"
- hideKeyboard
- tapOn:
    id: "submit-button"
- assertVisible:
    id: "home-screen"
- tapOn:
    text: "QA Test Group"
- assertVisible:
    id: "expense-list-screen"
- tapOn:
    id: "add-expense-button"
- assertVisible:
    text: "Create Expense"
- assertVisible:
    id: "edit-expense-title-input"
- assertVisible:
    id: "edit-expense-amount-input"
- assertVisible:
    id: "edit-expense-paid-by-picker-button"
# U5: key interactive elements must have real, non-empty accessibility
# labels/roles (what TalkBack/VoiceOver would announce).
- assertVisible:
    id: "edit-expense-title-input"
    enabled: true
# Save button is below the fold on the CI emulator; scroll after the
# top-of-form assertions (scrolling hides the title input).
- scrollUntilVisible:
    element:
      id: "edit-expense-save-button"
- assertVisible:
    id: "edit-expense-save-button"
    enabled: true
# Settle at the very bottom of the form (extra scrolls are no-ops there) so the
# frame does not depend on where scrollUntilVisible happened to stop.
- scroll
- scroll
- scroll
- assertScreenshot: "add-expense-screen"
