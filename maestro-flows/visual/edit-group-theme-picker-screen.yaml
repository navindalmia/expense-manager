appId: com.navindalmia.expensemanager
---
# Visual-regression baseline for issue #93: the Edit Group modal's theme
# picker. EditGroupModal used to fetch themes only once on mount, so a theme
# created after HomeScreen loaded never showed up here. The functional
# regression test (issue-93-edit-group-theme-list-stale.test.tsx) pins the
# refetch-on-open behaviour; this flow pins how the opened picker looks.
# Logs in as the pre-verified QA user (test@test.com) and acts on its own freshly created group ("Visual Theme 93"), not the first group in the
# list, so the screenshot is the same on every run and shard.
- runFlow:
    file: ../shared/login-and-create-group.yaml
    env:
      GROUP_NAME: "Visual Theme 93"
- tapOn:
    text: ".*Edit Group.*"
    below: "Visual Theme 93"
- assertVisible:
    id: "edit-group-name-input"
- tapOn:
    id: "edit-group-theme-picker-button"
- assertVisible:
    text: "Select Theme"
- assertScreenshot: "edit-group-theme-picker-screen"
