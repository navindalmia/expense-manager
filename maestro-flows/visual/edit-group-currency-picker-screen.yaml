appId: com.navindalmia.expensemanager
---
# U4 (visual-regression baseline) + U5 (accessibility) for EditGroupModal
# with the currency picker section visible - covers issue #51 (group
# currency list) on the Edit path specifically, which is a separate
# component/testID namespace (`edit-group-currency-option-*`, dynamically
# loaded via getCurrencies()) from CreateGroupScreen's hardcoded
# `currency-*` buttons - see create-group-currency-picker-screen.yaml for
# that half. Also exercises #44 (group card after edit) by returning to
# HomeScreen post-edit in the group-list-screen.yaml flow.
# Logs in as the pre-verified QA user (test@test.com) and acts on its own freshly created group ("Visual Currency 118"), not the first group in the
# list, so the screenshot is the same on every run and shard.
- runFlow:
    file: ../shared/login-and-create-group.yaml
    env:
      GROUP_NAME: "Visual Currency 118"
- tapOn:
    text: ".*Edit Group.*"
    below: "Visual Currency 118"
- assertVisible:
    id: "edit-group-name-input"
- assertVisible:
    id: "edit-group-currency-option-GBP"
- assertVisible:
    id: "edit-group-currency-option-GBP"
    enabled: true
- assertVisible:
    id: "edit-group-currency-option-USD"
    enabled: true
- assertScreenshot: "edit-group-currency-picker-screen"
