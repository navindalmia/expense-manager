appId: com.navindalmia.expensemanager
---
# Visual baseline for GitHub issue #45 (safe-area insets under the Android 3-button nav bar).
# Requires the AVD to use 3-button navigation and a group named e2e-paidby45-group
# with many members (seeded via the API, see PR description).
# Uses the standing pre-verified QA test user (test@test.com) - see
# PROJECT_MEMORY, not the on-hold email-verification flows.
- launchApp:
    clearState: true
# Dismiss the emulator's own "Pixel Launcher isn't responding" ANR dialog if
# it's up - a standing OS-level dialog (not app state, so clearState doesn't
# touch it), seen persisting across every flow in a single CI run once it
# appears under CPU pressure (confirmed via screenshot 2026-09-01, run
# 33512863222). optional: true means this is a no-op when it's not showing.
- tapOn:
    text: "Wait"
    optional: true
- assertVisible:
    id: "email-input"
- tapOn:
    id: "email-input"
- inputText: "test@test.com"
# The ANR dialog above was confirmed (2026-09-01, run 33518292719) to
# recur mid-flow, not just once at launch - it reappeared here, right
# before the password field, in that run's screenshots. Root cause is
# addressed in ci.yml (disable-animations + lighter emulator-options);
# this is defense-in-depth for whatever CPU pressure remains.
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    id: "password-input"
- inputText: "Test1234!"
- hideKeyboard
- tapOn:
    id: "submit-button"
- assertVisible:
    id: "home-screen"
- scrollUntilVisible:
    element:
      text: "e2e-paidby45-group"
- tapOn:
    text: "e2e-paidby45-group"
- assertVisible:
    id: "expense-list-screen"
- tapOn:
    id: "add-expense-button"
- tapOn:
    id: "edit-expense-paid-by-picker-button"
- assertVisible:
    id: "edit-expense-paid-by-modal-close-button"
# Dismiss the dev-build LogBox "Open debugger" toast so it is not baked into the baseline.
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          point: "92%,89%"
- assertScreenshot: "payer-picker-modal-safe-area"
