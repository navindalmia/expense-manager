appId: com.navindalmia.expensemanager
---
# U4 (visual-regression baseline) + U5 (accessibility) for LoginScreen.
# Covers app launch through the first screen a user ever sees.
- launchApp:
    clearState: true
# Dismiss the emulator's own "Pixel Launcher isn't responding" ANR dialog if
# it's up - a standing OS-level dialog (not app state, so clearState doesn't
# touch it), seen persisting across every flow in a single CI run once it
# appears under CPU pressure (confirmed via screenshot 2026-09-01, run
# 33512863222). optional: true means this is a no-op when it's not showing.
- tapOn:
    text: "Wait"
    optional: true
- assertVisible:
    id: "email-input"
- assertVisible:
    id: "password-input"
- assertVisible:
    id: "submit-button"
# U5: key interactive elements must have real, non-empty accessibility labels
# (what TalkBack/VoiceOver would announce) - not blank, not a raw testID leaking through.
- assertVisible:
    id: "email-input"
    enabled: true
- assertVisible:
    id: "password-input"
    enabled: true
- assertVisible:
    id: "submit-button"
    enabled: true
- assertScreenshot: "login-screen"
