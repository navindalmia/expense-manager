appId: com.navindalmia.expensemanager
---
# U4 (visual-regression baseline) + U5 (accessibility) for CreateGroupScreen
# with the currency picker section visible - covers issue #51 (group currency
# list). Uses the standing pre-verified QA test user (test@test.com).
- launchApp:
    clearState: true
# Dismiss the emulator's own "Pixel Launcher isn't responding" ANR dialog if
# it's up - a standing OS-level dialog (not app state, so clearState doesn't
# touch it), seen persisting across every flow in a single CI run once it
# appears under CPU pressure. optional: true means this is a no-op when it's
# not showing.
- tapOn:
    text: "Wait"
    optional: true
- assertVisible:
    id: "email-input"
- tapOn:
    id: "email-input"
- inputText: "test@test.com"
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    id: "password-input"
- inputText: "Test1234!"
- hideKeyboard
- tapOn:
    id: "submit-button"
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "add-group-button"
- assertVisible:
    id: "group-name-input"
- assertVisible:
    id: "currency-GBP"
# U5: currency options must have real, non-empty accessibility labels/roles
# (what TalkBack/VoiceOver would announce) - not blank, not a raw testID.
- assertVisible:
    id: "currency-GBP"
    enabled: true
- assertVisible:
    id: "currency-USD"
    enabled: true
- assertScreenshot: "create-group-currency-picker-screen"
