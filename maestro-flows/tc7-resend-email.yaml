---
# TC7: Resend verification email
appId: com.navindalmia.expensemanager
name: TC7 - Resend Verification Email
---
- launchApp

# Generate unique test email
- evalScript: ${output.testEmail = 'e2e-resend-' + Date.now() + '@example.com'}

# Create user
- runFlow:
    file: shared-signup-flow.yaml
    env:
      email: ${output.testEmail}
      password: "TestPass123!"
      name: "Test User"

# On CheckEmailScreen
- assertVisible:
    text: "Resend"

# Record initial token count
- evalScript: |
    const response = http.post('http://localhost:4000/api/internal/verify-user', {
        body: JSON.stringify({ email: '${output.testEmail}' }),
        headers: { 'Content-Type': 'application/json' }
    });
    output.userStateBefore = json(response.body);

# Click resend
- tapOn:
    text: "Resend"

- waitForAnimationToEnd

# Verify: Success message shown
- assertVisible:
    text: "sent"


# DATABASE: Verify new token was created
- evalScript: |
    const response = http.post('http://localhost:4000/api/internal/verify-user', {
        body: JSON.stringify({ email: '${output.testEmail}' }),
        headers: { 'Content-Type': 'application/json' }
    });
    output.userStateAfter = json(response.body);

# Token count should increase (new token created)
- assertTrue:
    condition: ${output.userStateAfter.activeTokenCount > 0}
    label: "New token should be available after resend"
