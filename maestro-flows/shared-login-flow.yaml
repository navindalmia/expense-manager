---
# SHARED FLOW: User Login
# Used by: TC5, TC6
appId: com.navindalmia.expensemanager
name: LoginFlow

params:
  - email
  - password
---
# Navigate to login screen
- tapOn:
    text: "Already have account?"

- waitForAnimationToEnd

# Fill login form
- tapOn:
    id: email-input
- inputText: ${email}

- tapOn:
    id: password-input
- inputText: ${password}

# Submit login
- tapOn:
    text: Login

- waitForAnimationToEnd
