---
# SHARED FLOW: User Login
# Used by: TC5, TC6
appId: com.navindalmia.expensemanager
name: LoginFlow

params:
  - email
  - password
---
# Navigate to login screen (tap the actual "Login" link, not the static prefix text)
- tapOn:
    text: "Login"

- waitForAnimationToEnd

# Fill login form
- tapOn:
    id: email-input
- inputText: ${email}

- tapOn:
    id: password-input
- inputText: ${password}

# Submit login (id, for consistency/robustness with the signup flow's fix -
# same screen component, same risk if a future copy change adds another
# "Login" text node)
- tapOn:
    id: submit-button

- waitForAnimationToEnd
