---
# SHARED FLOW: User Signup
# Used by: TC1, TC2, TC5, TC6, TC7
appId: com.navindalmia.expensemanager
name: SignupFlow

params:
  - email
  - password
  - name
---
# Navigate to signup
- tapOn:
    text: "Signup"

- waitForAnimationToEnd

# Fill signup form
- tapOn:
    id: email-input
- inputText: ${email}

- tapOn:
    id: password-input
- inputText: ${password}

- tapOn:
    id: name-input
- inputText: ${name}

# Submit signup
- tapOn:
    text: "Create Account"

- waitForAnimationToEnd

# Wait for CheckEmailScreen to appear
- extendedWaitUntil:
    visible:
      text: "Check your email"
    timeout: 5000
- assertVisible:
    text: "Check your email"
