---
# TC5: Login is blocked for unverified email
appId: com.navindalmia.expensemanager
name: TC5 - Login Blocked for Unverified Email
---
- launchApp

# Generate unique test email
- evalScript: ${output.testEmail = 'e2e-blocked-' + Date.now() + '@example.com'}
- evalScript: ${output.testPassword = 'TestPass123!'}

# Create unverified user
- runFlow:
    file: shared-signup-flow.yaml
    env:
      email: ${output.testEmail}
      password: ${output.testPassword}
      name: "Test User"

# Go back to login screen
- back

# Run login flow
- runFlow:
    file: shared-login-flow.yaml
    env:
      email: ${output.testEmail}
      password: ${output.testPassword}

- waitForAnimationToEnd

# Verify: Login is blocked with email verification error
- extendedWaitUntil:
    visible:
      text: "verify your email"
    timeout: 5000
- assertVisible:
    text: "verify your email"

# DATABASE: Confirm user still unverified
- runFlow:
    file: shared-verify-email-state.yaml
    env:
      email: ${output.testEmail}
      expectedEmailVerified: false
      expectedTokenIsUsed: false
