name: EAS Build (Android preview)

# Builds an installable Android APK via EAS whenever frontend code changes
# land on master. Uses the "preview" profile (internal distribution, points
# at the live Render backend) — same as the manual `eas build` workflow.
on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/eas-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

      - name: Generate release notes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "RELEASE_NOTES=$(node scripts/eas-release-notes.js "$BEFORE_SHA" "$HEAD_SHA")" >> "$GITHUB_ENV"

      - name: Build Android (preview profile)
        working-directory: frontend
        run: npx eas-cli build --platform android --profile preview --non-interactive --no-wait --message "$RELEASE_NOTES"

  # Publishes a JS-only OTA update to already-installed builds on the "preview"
  # channel. Runs alongside the full build job (not instead of it) — existing
  # installs pick up the update immediately over-the-air, while the full build
  # above stays available for fresh installs or when native code has changed
  # (new native modules, permission changes, SDK upgrades still require
  # installing that new APK once; OTA cannot deliver native changes).
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

      - name: Generate release notes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "RELEASE_NOTES=$(node scripts/eas-release-notes.js "$BEFORE_SHA" "$HEAD_SHA")" >> "$GITHUB_ENV"

      - name: Publish EAS Update (preview channel)
        working-directory: frontend
        run: npx eas-cli update --branch preview --message "$RELEASE_NOTES" --non-interactive
