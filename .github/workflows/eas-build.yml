name: EAS Build (Android preview)

# Builds an installable Android APK via EAS whenever frontend code changes
# land on master. Uses the "preview" profile (internal distribution, points
# at the live Render backend) — same as the manual `eas build` workflow.
on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/eas-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build Android (preview profile)
        working-directory: frontend
        run: npx eas-cli build --platform android --profile preview --non-interactive --no-wait
