name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: expense_manager_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/expense_manager_ci
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 24h
      NODE_ENV: test
      REQUIRE_EMAIL_VERIFICATION: "false"
      APP_FRONTEND_URL: http://localhost:19006
      APP_SCHEME: expensemanager
      APP_NAME: Expense Manager
      PORT: 4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Test
        working-directory: backend
        run: npm test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test
        working-directory: frontend
        run: npm test -- --run

  e2e-mobile:
    runs-on: ubuntu-latest
    # NOTE: Not yet wired to a real emulator/Maestro run. This job is scaffolded but
    # intentionally not enforced by branch protection until U3-U5 land (see
    # docs/plans/2026-08-22-001-feat-ci-visual-regression-a11y-gates-plan.md) — there is
    # no Android SDK/emulator/Maestro CLI available to develop or verify this job against
    # in this environment yet. Implementing this step for real requires Android Studio /
    # SDK to be set up first (see plan's KTD4 / Risks section).
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder - see plan for Android emulator + Maestro wiring
        run: echo "e2e-mobile job not yet implemented - blocked on local Android tooling setup"
